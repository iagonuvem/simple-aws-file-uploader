service: aws-file-service
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    FILES_BUCKET: ${self:service}-${self:provider.stage}-files
    TABLE_NAME: ${self:service}-${self:provider.stage}-files
    PRESIGN_EXPIRES_SECONDS: '900' # 15 min
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:HeadObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${self:provider.environment.FILES_BUCKET}
            - arn:aws:s3:::${self:provider.environment.FILES_BUCKET}/*
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.TABLE_NAME}

plugins:
  - serverless-webpack
  - serverless-offline
  - serverless-iam-roles-per-function

package:
  patterns:
    - '!node_modules/aws-sdk/**'
    - 'src/**'
    - 'package.json'
    - 'package-lock.json'

functions:
  api:
    handler: src/api/handler.handler
    events:
      - httpApi:
          method: ANY
          path: /{proxy+}
      - httpApi:
          method: ANY
          path: /

  s3Extractor:
    handler: src/extract/handler.handleS3
    events:
      - s3:
          bucket: ${self:provider.environment.FILES_BUCKET}
          event: s3:ObjectCreated:Put
          existing: true

resources:
  Resources:
    FilesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName:
          Fn::Sub: '${self:service}-${self:provider.stage}-files'
        VersioningConfiguration:
          Status: Enabled
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: ["PUT","GET","HEAD"]
              AllowedOrigins: ["*"] # ajuste p/ domínios do seu front
              MaxAge: 3000

    FilesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName:
          Fn::Sub: '${self:service}-${self:provider.stage}-files'
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: file_id
            AttributeType: S
        KeySchema:
          - AttributeName: file_id
            KeyType: HASH
